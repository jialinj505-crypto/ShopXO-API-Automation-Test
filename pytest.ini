[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# 保证项目根目录在 sys.path 中（直接执行 pytest 也能导入 config/core）
pythonpath = .

# 默认参数：CI 与本地都带上的基础项；Allure/HTML 报告参数由 run.py 组装
addopts = -ra -v --strict-markers --tb=short --color=no

markers =
    smoke: 冒烟用例，提交前快速校验核心链路
    regression: 全量回归用例
    p0: 核心业务链路（登录/搜索/加购/下单）
    positive: 正向用例
    boundary: 边界用例
    negative: 异常用例
    e2e: 端到端闭环用例
    offline: 离线用例（不依赖真实环境，用 mock 验证框架自身逻辑）；SHOPXO_OFFLINE=1 时只执行这些
    integration: 集成用例（需要真实被测环境）；离线模式下会被取消选择
    requires(name): 需要特定环境能力（如 coupon / merchant），环境不具备时自动跳过

log_level = INFO
log_format = %(asctime)s | %(levelname)-7s | %(name)s | %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
